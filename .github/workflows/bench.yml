name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # daily 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Bench (GOMAXPROCS=${{ matrix.gomaxprocs }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gomaxprocs: [1, 2, 4]
    env:
      GOMAXPROCS: ${{ matrix.gomaxprocs }}
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc

      - name: Install deps + build web assets
        run: npm ci && npm run build

      - name: Embed web dist
        run: make webdist-only

      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem -count=5 -timeout 600s \
            ./internal/database/ ./internal/api/ 2>&1 \
            | tee bench-raw-${{ matrix.gomaxprocs }}.txt

          # Produce a clean file with only benchmark lines + ok/FAIL summary.
          awk '
            /^goos:/ || /^goarch:/ || /^pkg:/ || /^cpu:/ || /^PASS/ || /^FAIL/ || /^ok / { print; next }
            /^Benchmark/ { bname = $1; next }
            /^[ \t]+[0-9]+/ && bname != "" { print bname $0; bname = ""; next }
          ' bench-raw-${{ matrix.gomaxprocs }}.txt > bench-${{ matrix.gomaxprocs }}.txt || true

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: bench-gomaxprocs-${{ matrix.gomaxprocs }}
          path: bench-${{ matrix.gomaxprocs }}.txt
          retention-days: 30

      - name: Benchmark summary
        if: always()
        run: |
          FILE="bench-${{ matrix.gomaxprocs }}.txt"
          {
            echo "### 🏎️ Benchmarks — GOMAXPROCS=${{ matrix.gomaxprocs }}"
            echo ""

            # Parse benchmark results into a summary table.
            # Each benchmark may have a custom metric (identities/sec, reads/sec, etc.).
            # We average across the -count=5 runs per benchmark.
            echo "| Benchmark | ns/op | custom metric | B/op | allocs/op |"
            echo "|-----------|------:|:-------------:|-----:|----------:|"

            awk '
              /^Benchmark/ {
                name = $1
                sub(/-[0-9]+$/, "", name)       # strip GOMAXPROCS suffix
                ns   = $3                         # ns/op value
                bop  = $(NF-3)                    # B/op
                aop  = $(NF-1)                    # allocs/op

                # Find the custom metric (field between ns/op and B/op).
                custom_val = ""
                custom_unit = ""
                for (i = 5; i <= NF-4; i += 2) {
                  custom_val = $i
                  custom_unit = $(i+1)
                }

                # Accumulate for averaging.
                count[name]++
                sum_ns[name]   += ns
                sum_bop[name]  += bop
                sum_aop[name]  += aop
                if (custom_val != "") {
                  sum_custom[name] += custom_val
                  unit[name] = custom_unit
                }

                # Preserve insertion order.
                if (count[name] == 1) {
                  order[++n] = name
                }
              }
              END {
                for (i = 1; i <= n; i++) {
                  nm = order[i]
                  c  = count[nm]
                  avg_ns  = int(sum_ns[nm] / c)
                  avg_bop = int(sum_bop[nm] / c)
                  avg_aop = int(sum_aop[nm] / c)

                  # Format custom metric.
                  if (unit[nm] != "") {
                    avg_custom = int(sum_custom[nm] / c)
                    cm = avg_custom " " unit[nm]
                  } else {
                    cm = "—"
                  }

                  # Shorten name: strip "Benchmark" prefix.
                  short = nm
                  sub(/^Benchmark/, "", short)

                  printf "| `%s` | %d | %s | %d | %d |\n", short, avg_ns, cm, avg_bop, avg_aop
                }
              }
            ' "$FILE"

            echo ""

            # Package timing.
            grep -E '^ok\s' "$FILE" | while read -r line; do
              pkg=$(echo "$line" | awk '{print $2}' | sed 's|github.com/zitadel/zitadel/||')
              dur=$(echo "$line" | awk '{print $3}')
              echo "- \`$pkg\`: $dur"
            done

          } >> $GITHUB_STEP_SUMMARY

  # ── Compare branch vs base on PRs to catch regressions ──
  compare:
    name: Regression Check
    needs: bench
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Download PR bench results
        uses: actions/download-artifact@v7.0.0
        with:
          pattern: bench-gomaxprocs-*
          path: pr-results/

      - name: Run base branch benchmarks
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git checkout FETCH_HEAD -- .
          npm ci && npm run build
          make webdist-only
          GOMAXPROCS=4 go test -bench=. -benchmem -count=5 -timeout 600s \
            ./internal/database/ ./internal/api/ 2>&1 \
            | tee base-bench-raw.txt

          awk '
            /^goos:/ || /^goarch:/ || /^pkg:/ || /^cpu:/ || /^PASS/ || /^FAIL/ || /^ok / { print; next }
            /^Benchmark/ { bname = $1; next }
            /^[ \t]+[0-9]+/ && bname != "" { print bname $0; bname = ""; next }
          ' base-bench-raw.txt > base-bench.txt || true

      - name: Compare (benchstat)
        if: always()
        run: |
          echo "## 📊 Benchmark Regression Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Comparing **${{ github.base_ref }}** (base) → **${{ github.head_ref }}** (PR)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          benchstat base-bench.txt pr-results/bench-gomaxprocs-4/bench-4.txt 2>&1 \
            >> $GITHUB_STEP_SUMMARY || echo "(benchstat comparison failed)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Also print to logs for quick visibility.
          echo "═══ Regression Check (base → PR, GOMAXPROCS=4) ═══"
          benchstat base-bench.txt pr-results/bench-gomaxprocs-4/bench-4.txt 2>&1 || true

  # ── Scaling analysis (nightly + manual only) ──
  scaling:
    name: vCPU Scaling Analysis
    needs: bench
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Download all bench results
        uses: actions/download-artifact@v7.0.0
        with:
          pattern: bench-gomaxprocs-*
          path: results/

      - name: Scaling comparison
        if: always()
        run: |
          echo "## 📈 vCPU Scaling Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          benchstat \
            results/bench-gomaxprocs-1/bench-1.txt \
            results/bench-gomaxprocs-2/bench-2.txt \
            results/bench-gomaxprocs-4/bench-4.txt \
            2>&1 >> $GITHUB_STEP_SUMMARY || echo "(benchstat comparison failed)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
