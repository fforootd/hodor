name: Benchmarks

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare-webdist:
    name: Prepare Webdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build embedded web assets
        run: |
          npm ci --prefer-offline
          npm run build
          make webdist-only
          tar -czf webdist.tgz internal/server/webdist

      - name: Upload embedded web assets
        uses: actions/upload-artifact@v4.6.2
        with:
          name: webdist
          path: webdist.tgz
          retention-days: 1

  bench-main:
    name: Bench (GOMAXPROCS=4)
    needs: prepare-webdist
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GOMAXPROCS: 4
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Restore embedded web assets
        uses: actions/download-artifact@v4.3.0
        with:
          name: webdist
          path: .

      - name: Extract embedded web assets
        run: tar -xzf webdist.tgz

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem -count=5 -timeout 600s \
            ./internal/database/ ./internal/api/ 2>&1 \
            | tee bench-raw-4.txt

          awk '
            /^goos:/ || /^goarch:/ || /^pkg:/ || /^cpu:/ || /^PASS/ || /^FAIL/ || /^ok / { print; next }
            /^Benchmark/ { bname = $1; next }
            /^[ \t]+[0-9]+/ && bname != "" { print bname $0; bname = ""; next }
          ' bench-raw-4.txt > bench-4.txt || true

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: bench-gomaxprocs-4
          path: bench-4.txt
          retention-days: 30

      - name: Benchmark summary
        if: always()
        run: |
          FILE="bench-4.txt"
          {
            echo "### 🏎️ Benchmarks — GOMAXPROCS=4"
            echo ""
            echo "| Benchmark | ns/op | custom metric | B/op | allocs/op |"
            echo "|-----------|------:|:-------------:|-----:|----------:|"

            awk '
              /^Benchmark/ {
                name = $1
                sub(/-[0-9]+$/, "", name)
                ns   = $3
                bop  = $(NF-3)
                aop  = $(NF-1)
                custom_val = ""
                custom_unit = ""
                for (i = 5; i <= NF-4; i += 2) {
                  custom_val = $i
                  custom_unit = $(i+1)
                }
                count[name]++
                sum_ns[name] += ns
                sum_bop[name] += bop
                sum_aop[name] += aop
                if (custom_val != "") {
                  sum_custom[name] += custom_val
                  unit[name] = custom_unit
                }
                if (count[name] == 1) {
                  order[++n] = name
                }
              }
              END {
                for (i = 1; i <= n; i++) {
                  nm = order[i]
                  c = count[nm]
                  avg_ns = int(sum_ns[nm] / c)
                  avg_bop = int(sum_bop[nm] / c)
                  avg_aop = int(sum_aop[nm] / c)
                  if (unit[nm] != "") {
                    avg_custom = int(sum_custom[nm] / c)
                    cm = avg_custom " " unit[nm]
                  } else {
                    cm = "—"
                  }
                  short = nm
                  sub(/^Benchmark/, "", short)
                  printf "| `%s` | %d | %s | %d | %d |\n", short, avg_ns, cm, avg_bop, avg_aop
                }
              }
            ' "$FILE"

            echo ""
            grep -E '^ok\s' "$FILE" | while read -r line; do
              pkg=$(echo "$line" | awk '{print $2}' | sed 's|github.com/zitadel/zitadel/||')
              dur=$(echo "$line" | awk '{print $3}')
              echo "- \`$pkg\`: $dur"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  bench-scaling:
    name: Bench (GOMAXPROCS=${{ matrix.gomaxprocs }})
    needs: prepare-webdist
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gomaxprocs: [1, 2, 4]
    env:
      GOMAXPROCS: ${{ matrix.gomaxprocs }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Restore embedded web assets
        uses: actions/download-artifact@v4.3.0
        with:
          name: webdist
          path: .

      - name: Extract embedded web assets
        run: tar -xzf webdist.tgz

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem -count=5 -timeout 600s \
            ./internal/database/ ./internal/api/ 2>&1 \
            | tee bench-raw-${{ matrix.gomaxprocs }}.txt

          awk '
            /^goos:/ || /^goarch:/ || /^pkg:/ || /^cpu:/ || /^PASS/ || /^FAIL/ || /^ok / { print; next }
            /^Benchmark/ { bname = $1; next }
            /^[ \t]+[0-9]+/ && bname != "" { print bname $0; bname = ""; next }
          ' bench-raw-${{ matrix.gomaxprocs }}.txt > bench-${{ matrix.gomaxprocs }}.txt || true

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: bench-gomaxprocs-${{ matrix.gomaxprocs }}
          path: bench-${{ matrix.gomaxprocs }}.txt
          retention-days: 30

  scaling:
    name: vCPU Scaling Analysis
    needs: bench-scaling
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Download all bench results
        uses: actions/download-artifact@v4.3.0
        with:
          pattern: bench-gomaxprocs-*
          path: results/

      - name: Scaling comparison
        if: always()
        run: |
          echo "## 📈 vCPU Scaling Analysis" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          benchstat \
            results/bench-gomaxprocs-1/bench-1.txt \
            results/bench-gomaxprocs-2/bench-2.txt \
            results/bench-gomaxprocs-4/bench-4.txt \
            2>&1 >> "$GITHUB_STEP_SUMMARY" || echo "(benchstat comparison failed)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
