name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # daily 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Bench (GOMAXPROCS=${{ matrix.gomaxprocs }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gomaxprocs: [1, 2, 4]
    env:
      GOMAXPROCS: ${{ matrix.gomaxprocs }}
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc

      - name: Install deps + build web assets
        run: npm ci && npm run build

      - name: Embed web dist
        run: make webdist-only

      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem -count=5 -timeout 600s \
            ./internal/database/ ./internal/api/ 2>&1 \
            | grep -v 'schema ready\|Columns in\|seeded\|bootstrapped\|alias.*registered\|analytics.*OLTP\|OIDC Provider\|Path config\|No entities\|net/http.*invalid byte' \
            | tee bench-${{ matrix.gomaxprocs }}.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: bench-gomaxprocs-${{ matrix.gomaxprocs }}
          path: bench-${{ matrix.gomaxprocs }}.txt
          retention-days: 30

      - name: Benchmark summary
        if: always()
        run: |
          echo "### 🏎️ GOMAXPROCS=${{ matrix.gomaxprocs }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat bench-${{ matrix.gomaxprocs }}.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ── Compare branch vs base on PRs to catch regressions ──
  compare:
    name: Regression Check
    needs: bench
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Download PR bench results
        uses: actions/download-artifact@v7.0.0
        with:
          pattern: bench-gomaxprocs-*
          path: pr-results/

      - name: Run base branch benchmarks
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git checkout FETCH_HEAD -- .
          npm ci && npm run build
          make webdist-only
          GOMAXPROCS=4 go test -bench=. -benchmem -count=5 -timeout 600s \
            ./internal/database/ ./internal/api/ 2>&1 \
            | grep -v 'schema ready\|Columns in\|seeded\|bootstrapped\|alias.*registered\|analytics.*OLTP\|OIDC Provider\|Path config\|No entities\|net/http.*invalid byte' \
            | tee base-bench.txt

      - name: Compare (benchstat)
        if: always()
        run: |
          echo "## 📊 Benchmark Regression Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Comparing **${{ github.base_ref }}** (base) → **${{ github.head_ref }}** (PR)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          benchstat base-bench.txt pr-results/bench-gomaxprocs-4/bench-4.txt 2>&1 \
            >> $GITHUB_STEP_SUMMARY || echo "(benchstat comparison failed)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Also print to logs for quick visibility.
          echo "═══ Regression Check (base → PR, GOMAXPROCS=4) ═══"
          benchstat base-bench.txt pr-results/bench-gomaxprocs-4/bench-4.txt 2>&1 || true

  # ── Scaling analysis (nightly + manual only) ──
  scaling:
    name: vCPU Scaling Analysis
    needs: bench
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Download all bench results
        uses: actions/download-artifact@v7.0.0
        with:
          pattern: bench-gomaxprocs-*
          path: results/

      - name: Scaling comparison
        if: always()
        run: |
          echo "## 📈 vCPU Scaling Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          benchstat \
            results/bench-gomaxprocs-1/bench-1.txt \
            results/bench-gomaxprocs-2/bench-2.txt \
            results/bench-gomaxprocs-4/bench-4.txt \
            2>&1 >> $GITHUB_STEP_SUMMARY || echo "(benchstat comparison failed)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
