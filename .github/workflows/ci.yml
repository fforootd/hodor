name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Build + Test ─────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web assets
        working-directory: web
        run: npx vite build

      - name: Embed web assets for Go
        run: cp -r web/dist internal/server/webdist

      - name: Build Go
        run: go build ./...

      - name: Test
        run: go test -race -count=1 -timeout 120s ./...

      - name: Fuzz (10s each)
        run: |
          go test -fuzz FuzzParseIDTokenClaims -fuzztime 10s ./internal/login/
          go test -fuzz FuzzMapClaims -fuzztime 10s ./internal/login/

  # ─── Lint ─────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web assets
        working-directory: web
        run: npx vite build

      - name: Embed web assets for Go
        run: cp -r web/dist internal/server/webdist

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Files not formatted:"
            gofmt -l .
            exit 1
          fi

  # ─── Release (goreleaser, main only) ─────────────────────
  release:
    name: Release (snapshot)
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web assets
        working-directory: web
        run: npx vite build

      - name: Embed web assets for Go
        run: cp -r web/dist internal/server/webdist

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zitadel-snapshot
          path: dist/zitadel_*/
          retention-days: 7

