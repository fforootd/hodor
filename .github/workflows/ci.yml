name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lint (Go + Web, parallel) ───────────────────────────
  lint-go:
    name: Lint Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc

      - name: Install deps + build web assets
        run: npm ci && npm run build

      - name: Embed web dist
        run: make webdist-only

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.2.0
        with:
          version-file: .golangci-lint-version

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Files not formatted:"
            gofmt -l .
            exit 1
          fi

  lint-web:
    name: Lint Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck -w web

  # ─── Test (Go + Web, parallel) ───────────────────────────
  test-go:
    name: Test Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc

      - name: Install deps + build web assets
        run: npm ci && npm run build

      - name: Embed web dist
        run: make webdist-only

      - name: Build Go
        run: go build ./...

      - name: Test
        run: go test -race -count=1 -timeout 240s ./...

      - name: Fuzz (10s each)
        run: |
          # Login layer
          go test -fuzz FuzzParseIDTokenClaims -fuzztime 10s ./internal/login/
          go test -fuzz FuzzMapClaims -fuzztime 10s ./internal/login/
          # API layer
          go test -fuzz FuzzAPIJSON -fuzztime 10s ./internal/api/
          go test -fuzz FuzzSessionToken -fuzztime 10s ./internal/api/
          go test -fuzz FuzzBearerTokenResolution -fuzztime 10s ./internal/api/
          go test -fuzz FuzzCookieTokenResolution -fuzztime 10s ./internal/api/
          go test -fuzz FuzzXIdentityIdHeader -fuzztime 10s ./internal/api/
          # Session layer
          go test -fuzz FuzzCookieVerify -fuzztime 10s ./internal/session/
          go test -fuzz FuzzCookieSign -fuzztime 10s ./internal/session/
          go test -fuzz FuzzCookieSignVerifyRoundTrip -fuzztime 10s ./internal/session/
          # Auth layer
          go test -fuzz FuzzExtractHash -fuzztime 10s ./internal/auth/

  test-web:
    name: Test Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc

      - run: npm ci

      - name: Vitest
        run: npm test -w web

  # ─── Postgres Integration ────────────────────────────────
  test-postgres:
    name: Postgres ${{ matrix.postgres-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres-version: [ '15', '16', '17', '18' ]
    env:
      TEST_POSTGRES_VERSION: ${{ matrix.postgres-version }}
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Postgres integration tests
        run: go test -v -count=1 -timeout 300s ./internal/database/...

  # ─── Release (goreleaser, main only) ─────────────────────
  release:
    name: Release (snapshot)
    runs-on: ubuntu-latest
    needs: [lint-go, lint-web, test-go, test-web, test-postgres]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc

      # goreleaser before.hooks handles: npm ci → npm run build → cp webdist
      - uses: goreleaser/goreleaser-action@v7.0.0
        with:
          version: latest
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.0
        with:
          name: zitadel-snapshot
          path: dist/zitadel_*/
          retention-days: 7
