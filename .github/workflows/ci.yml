name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Build + Test ─────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web assets + embed
        run: make webdist

      - name: Build Go
        run: go build ./...

      - name: Test
        run: go test -race -count=1 -timeout 120s ./...

      - name: Fuzz (10s each)
        run: |
          go test -fuzz FuzzParseIDTokenClaims -fuzztime 10s ./internal/login/
          go test -fuzz FuzzMapClaims -fuzztime 10s ./internal/login/

  # ─── Lint ─────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web assets + embed
        run: make webdist

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.2.0
        with:
          version-file: .golangci-lint-version

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Files not formatted:"
            gofmt -l .
            exit 1
          fi

  # ─── Release (goreleaser, main only) ─────────────────────
  release:
    name: Release (snapshot)
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # goreleaser before.hooks handles: npm ci → vite build → cp webdist
      - uses: goreleaser/goreleaser-action@v7.0.0
        with:
          version: latest
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.0
        with:
          name: zitadel-snapshot
          path: dist/zitadel_*/
          retention-days: 7
