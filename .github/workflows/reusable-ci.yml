name: Reusable CI

on:
  workflow_call:
    inputs:
      execution_tier_label:
        required: false
        type: string
        default: CI
      run_docs:
        required: false
        type: boolean
        default: true
      run_fast_rust:
        required: false
        type: boolean
        default: true
      run_fast_web:
        required: false
        type: boolean
        default: true
      run_journeys:
        required: false
        type: boolean
        default: true
      run_journeys_oidc:
        required: false
        type: boolean
        default: true
      run_contracts:
        required: false
        type: boolean
        default: true
      run_invariants:
        required: false
        type: boolean
        default: true
      run_subsystems:
        required: false
        type: boolean
        default: true
      run_conformance_oidc:
        required: false
        type: boolean
        default: true
      run_browser_artifacts:
        required: false
        type: boolean
        default: true
      run_fuzz:
        required: false
        type: boolean
        default: false
      artifact_prefix:
        required: false
        type: string
        default: ci

permissions:
  contents: read

jobs:
  noop:
    name: Noop
    if: ${{ !inputs.run_docs && !inputs.run_fast_rust && !inputs.run_fast_web && !inputs.run_journeys && !inputs.run_journeys_oidc && !inputs.run_contracts && !inputs.run_invariants && !inputs.run_subsystems && !inputs.run_browser_artifacts }}
    runs-on: ubuntu-latest
    steps:
      - name: No lanes selected
        run: echo "No reusable CI lanes selected."

  fast-rust-static:
    name: ${{ inputs.execution_tier_label }} / Fast / Rust / Static
    if: inputs.run_fast_rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Ensure embedded web placeholder exists
        run: just ensure-webdist

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

  fast-rust-tests:
    name: ${{ inputs.execution_tier_label }} / Fast / Rust / Tests
    if: inputs.run_fast_rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Ensure embedded web placeholder exists
        run: just ensure-webdist

      - name: Run cargo nextest
        run: cargo nextest run --workspace

  postgres-storage-integration:
    name: ${{ inputs.execution_tier_label }} / Fast / Storage / Postgres
    if: inputs.run_fast_rust
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Ensure embedded web placeholder exists
        run: just ensure-webdist

      - name: Run Postgres storage integration tests
        env:
          ZITADEL_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: cargo test -p zitadel-storage --test postgres_roles -- --nocapture

  fuzz-quick:
    name: ${{ inputs.execution_tier_label }} / Fast / Fuzz
    if: inputs.run_fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Ensure embedded web placeholder exists
        run: just ensure-webdist

      - name: Run fuzz targets (10s each)
        run: just fuzz-quick

  fast-docs-check:
    name: ${{ inputs.execution_tier_label }} / Fast / Docs / Check
    if: inputs.run_docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run stale-command checks
        run: just docs-check

  fast-docs-links:
    name: ${{ inputs.execution_tier_label }} / Fast / Docs / Links
    if: inputs.run_docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Validate local Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress README.md docs/**/*.md

  prepare-webdist:
    name: ${{ inputs.execution_tier_label }} / Prepare / Webdist
    if: inputs.run_browser_artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Build embedded web assets
        run: |
          npm ci --prefer-offline
          just web
          tar -czf webdist.tgz web/dist

      - name: Upload embedded web assets
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ inputs.artifact_prefix }}-webdist
          path: webdist.tgz
          retention-days: 1

  prepare-rust-binary:
    name: ${{ inputs.execution_tier_label }} / Prepare / Rust Binary
    if: inputs.run_browser_artifacts
    needs: prepare-webdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Restore embedded web assets
        uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ inputs.artifact_prefix }}-webdist
          path: .

      - name: Extract embedded web assets
        run: tar -xzf webdist.tgz

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build zitadel binary
        run: cargo build -p zitadel

      - name: Package zitadel binary
        run: |
          mkdir -p artifacts/prepare-rust-binary
          tar -czf artifacts/prepare-rust-binary/zitadel-debug.tgz -C target/debug zitadel

      - name: Upload zitadel binary artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ inputs.artifact_prefix }}-zitadel-binary
          path: artifacts/prepare-rust-binary/zitadel-debug.tgz
          retention-days: 1

  fast-web-static:
    name: ${{ inputs.execution_tier_label }} / Fast / Web / Static
    if: inputs.run_fast_web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Lint web
        run: npm run lint -w web

      - name: Typecheck web
        run: npm run typecheck -w web

  fast-web-unit:
    name: ${{ inputs.execution_tier_label }} / Fast / Web / Unit
    if: inputs.run_fast_web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run Vitest
        run: npm test -w web

  contracts:
    name: ${{ inputs.execution_tier_label }} / Contracts
    if: inputs.run_contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Ensure embedded web placeholder exists
        run: just ensure-webdist

      - name: Run contract suites
        run: just contracts

  invariants:
    name: ${{ inputs.execution_tier_label }} / Invariants
    if: inputs.run_invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Ensure embedded web placeholder exists
        run: just ensure-webdist

      - name: Run invariant suites
        run: just invariants

  subsystems:
    name: ${{ inputs.execution_tier_label }} / Subsystems
    if: inputs.run_subsystems
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Ensure embedded web placeholder exists
        run: just ensure-webdist

      - name: Run subsystem suites
        run: just subsystems

  journeys-admin:
    name: ${{ inputs.execution_tier_label }} / Journeys / Admin
    if: inputs.run_journeys && inputs.run_browser_artifacts
    needs: prepare-rust-binary
    runs-on: ubuntu-latest
    env:
      CI_TMP_DIR: ${{ github.workspace }}/.ci-tmp
      ZITADEL_BROWSER_TESTS_BINARY: ${{ github.workspace }}/.ci-tmp/zitadel-bin/zitadel
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Restore zitadel binary
        uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ inputs.artifact_prefix }}-zitadel-binary
          path: .

      - name: Extract zitadel binary
        run: |
          mkdir -p "$CI_TMP_DIR/zitadel-bin"
          tar -xzf zitadel-debug.tgz -C "$CI_TMP_DIR/zitadel-bin"

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run admin journey suite
        run: npm run test:journeys:admin -w browser-tests -- --reporter=github,line,html

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ inputs.artifact_prefix }}-journeys-admin-report
          path: |
            browser-tests/playwright-report
            browser-tests/test-results
          if-no-files-found: warn
          retention-days: 7

  journeys-oidc:
    name: ${{ inputs.execution_tier_label }} / Journeys / OIDC
    if: inputs.run_journeys_oidc && inputs.run_browser_artifacts
    needs: prepare-rust-binary
    runs-on: ubuntu-latest
    env:
      CI_TMP_DIR: ${{ github.workspace }}/.ci-tmp
      ZITADEL_BROWSER_TESTS_BINARY: ${{ github.workspace }}/.ci-tmp/zitadel-bin/zitadel
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Restore zitadel binary
        uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ inputs.artifact_prefix }}-zitadel-binary
          path: .

      - name: Extract zitadel binary
        run: |
          mkdir -p "$CI_TMP_DIR/zitadel-bin"
          tar -xzf zitadel-debug.tgz -C "$CI_TMP_DIR/zitadel-bin"

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run OIDC journey suite
        run: npm run test:journeys:oidc -w browser-tests -- --reporter=github,line,html

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ inputs.artifact_prefix }}-journeys-oidc-report
          path: |
            browser-tests/playwright-report
            browser-tests/test-results
          if-no-files-found: warn
          retention-days: 7
