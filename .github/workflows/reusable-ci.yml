name: Reusable CI

on:
  workflow_call:
    inputs:
      execution_tier_label:
        required: false
        type: string
        default: CI
      run_docs:
        required: false
        type: boolean
        default: true
      run_fast_rust:
        required: false
        type: boolean
        default: true
      run_fast_web:
        required: false
        type: boolean
        default: true
      run_journeys_admin:
        required: false
        type: boolean
        default: true
      run_journeys_login:
        required: false
        type: boolean
        default: true
      run_journeys_oidc:
        required: false
        type: boolean
        default: true
      run_journeys_quarantine:
        required: false
        type: boolean
        default: false
      run_contracts:
        required: false
        type: boolean
        default: true
      run_db:
        required: false
        type: boolean
        default: true
      run_invariants:
        required: false
        type: boolean
        default: true
      run_subsystems:
        required: false
        type: boolean
        default: true
      run_resilience:
        required: false
        type: boolean
        default: false
      artifact_prefix:
        required: false
        type: string
        default: ci

permissions:
  contents: read

jobs:
  noop:
    name: No Lanes
    if: ${{ !inputs.run_docs && !inputs.run_fast_rust && !inputs.run_fast_web && !inputs.run_journeys_admin && !inputs.run_journeys_login && !inputs.run_journeys_oidc && !inputs.run_journeys_quarantine && !inputs.run_contracts && !inputs.run_db && !inputs.run_invariants && !inputs.run_subsystems && !inputs.run_resilience }}
    runs-on: ubuntu-latest
    steps:
      - name: No lanes selected
        run: echo "No reusable CI lanes selected."

  # ── Fast lanes (all parallel, no dependencies) ──────────

  rust-static:
    name: Rust / Static
    if: inputs.run_fast_rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Create web/dist placeholder
        run: |
          mkdir -p web/dist/src/login web/dist/src/console web/dist/src/account web/dist/assets
          for d in login console account; do echo '<!DOCTYPE html><html><body>placeholder</body></html>' > "web/dist/src/$d/index.html"; done
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings

  rust-tests:
    name: Rust / Tests
    if: inputs.run_fast_rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Create web/dist placeholder
        run: |
          mkdir -p web/dist/src/login web/dist/src/console web/dist/src/account web/dist/assets
          for d in login console account; do echo '<!DOCTYPE html><html><body>placeholder</body></html>' > "web/dist/src/$d/index.html"; done
      - name: Run Rust tests
        run: |
          cargo nextest run --workspace --lib --bins
          cargo nextest run -p zitadel-app --test use_case_tests

  docs-check:
    name: Docs / Check
    if: inputs.run_docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - run: python3 tools/validate-testing-manifest.py

  docs-links:
    name: Docs / Links
    if: inputs.run_docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Validate local Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress README.md docs/**/*.md

  web-static:
    name: Web / Static
    if: inputs.run_fast_web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefer-offline
      - run: npm run lint -w web
      - run: npm run typecheck -w web

  web-unit:
    name: Web / Unit
    if: inputs.run_fast_web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefer-offline
      - run: npm test -w web

  # ── Build (single job: web assets + binary) ─────────────

  build:
    name: Build / Zitadel Binary
    if: inputs.run_journeys_admin || inputs.run_journeys_login || inputs.run_journeys_oidc || inputs.run_journeys_quarantine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build web assets and binary
        run: |
          npm ci --prefer-offline
          npm run build -w web
          cargo build -p zitadel
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ inputs.artifact_prefix }}-zitadel-binary
          path: target/debug/zitadel
          retention-days: 1

  # ── E2E journeys (matrix, parallel legs) ────────────────

  journeys:
    name: Journeys / ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Admin
            project: journeys-admin
            enabled: ${{ inputs.run_journeys_admin }}
          - name: Login
            project: journeys-login
            enabled: ${{ inputs.run_journeys_login }}
          - name: OIDC
            project: journeys-login-oidc
            enabled: ${{ inputs.run_journeys_oidc }}
          - name: Quarantine
            project: journeys-login-oidc
            enabled: ${{ inputs.run_journeys_quarantine }}
        exclude:
          - enabled: false
    env:
      ZITADEL_BROWSER_TESTS_BINARY: ${{ github.workspace }}/zitadel
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ inputs.artifact_prefix }}-zitadel-binary

      - run: chmod +x zitadel

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - run: npm ci --prefer-offline
      - run: npx playwright install --with-deps chromium

      - name: Run ${{ matrix.name }} journeys
        run: npm test -w browser-tests -- --project=${{ matrix.project }} --reporter=github,line,html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ inputs.artifact_prefix }}-journeys-${{ matrix.project }}-report
          path: |
            browser-tests/playwright-report
            browser-tests/test-results
          if-no-files-found: warn
          retention-days: 7

  # ── Database and integration lanes ──────────────────────

  db:
    name: DB
    if: inputs.run_db
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      spanner:
        image: gcr.io/cloud-spanner-emulator/emulator
        ports:
          - 9010:9010
          - 9020:9020
    env:
      ZITADEL_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      ZITADEL_TEST_SPANNER_EMULATOR_HOST: 127.0.0.1:9010
      ZITADEL_TEST_SPANNER_PROJECT: local-project
      ZITADEL_TEST_SPANNER_INSTANCE: test-instance
      ZITADEL_TEST_SPANNER_DATABASE_PREFIX: zitadeldb
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Create web/dist placeholder
        run: |
          mkdir -p web/dist/src/login web/dist/src/console web/dist/src/account web/dist/assets
          for d in login console account; do echo '<!DOCTYPE html><html><body>placeholder</body></html>' > "web/dist/src/$d/index.html"; done
      - name: Wait for Spanner emulator
        run: for i in $(seq 1 30); do nc -z 127.0.0.1 9010 && exit 0; sleep 1; done; echo "Spanner emulator did not start" >&2; exit 1
      - name: Verify generated schema artifacts
        run: |
          for backend in sqlite postgres spanner; do
            cargo run -p zitadel-db --example dump_generated_baseline -- "$backend" > "/tmp/baseline_$backend.sql"
            diff -u "migrations/$backend/00001_baseline.sql" "/tmp/baseline_$backend.sql"
          done
          cargo run -p zitadel-db --example dump_schema_manifest > /tmp/schema_manifest.json
          diff -u crates/zitadel-db/src/schema_manifest.json /tmp/schema_manifest.json
      - run: cargo test -p zitadel-db

  contracts:
    name: Contracts
    if: inputs.run_contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      spanner:
        image: gcr.io/cloud-spanner-emulator/emulator
        ports:
          - 9010:9010
          - 9020:9020
    env:
      ZITADEL_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      ZITADEL_TEST_SPANNER_EMULATOR_HOST: 127.0.0.1:9010
      ZITADEL_TEST_SPANNER_PROJECT: local-project
      ZITADEL_TEST_SPANNER_INSTANCE: test-instance
      ZITADEL_TEST_SPANNER_DATABASE_PREFIX: zitadelct
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Create web/dist placeholder
        run: |
          mkdir -p web/dist/src/login web/dist/src/console web/dist/src/account web/dist/assets
          for d in login console account; do echo '<!DOCTYPE html><html><body>placeholder</body></html>' > "web/dist/src/$d/index.html"; done
      - name: Wait for Spanner emulator
        run: for i in $(seq 1 30); do nc -z 127.0.0.1 9010 && exit 0; sleep 1; done; echo "Spanner emulator did not start" >&2; exit 1
      - run: cargo test -p zitadel-server --test contracts_http_router --test contracts_management_root_instance --test contracts_spanner_http_router

  invariants:
    name: Invariants
    if: inputs.run_invariants
    runs-on: ubuntu-latest
    services:
      spanner:
        image: gcr.io/cloud-spanner-emulator/emulator
        ports:
          - 9010:9010
          - 9020:9020
    env:
      ZITADEL_TEST_SPANNER_EMULATOR_HOST: 127.0.0.1:9010
      ZITADEL_TEST_SPANNER_PROJECT: local-project
      ZITADEL_TEST_SPANNER_INSTANCE: test-instance
      ZITADEL_TEST_SPANNER_DATABASE_PREFIX: zitadeliv
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Create web/dist placeholder
        run: |
          mkdir -p web/dist/src/login web/dist/src/console web/dist/src/account web/dist/assets
          for d in login console account; do echo '<!DOCTYPE html><html><body>placeholder</body></html>' > "web/dist/src/$d/index.html"; done
      - name: Wait for Spanner emulator
        run: for i in $(seq 1 30); do nc -z 127.0.0.1 9010 && exit 0; sleep 1; done; echo "Spanner emulator did not start" >&2; exit 1
      - run: cargo test -p zitadel-server --test invariants_tenant_instance_isolation
      - run: cargo test -p zitadel-fga --test invariants_authorization_hierarchy

  subsystems:
    name: Subsystems
    if: inputs.run_subsystems
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      spanner:
        image: gcr.io/cloud-spanner-emulator/emulator
        ports:
          - 9010:9010
          - 9020:9020
    env:
      ZITADEL_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      ZITADEL_TEST_SPANNER_EMULATOR_HOST: 127.0.0.1:9010
      ZITADEL_TEST_SPANNER_PROJECT: local-project
      ZITADEL_TEST_SPANNER_INSTANCE: test-instance
      ZITADEL_TEST_SPANNER_DATABASE_PREFIX: zitadelss
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Create web/dist placeholder
        run: |
          mkdir -p web/dist/src/login web/dist/src/console web/dist/src/account web/dist/assets
          for d in login console account; do echo '<!DOCTYPE html><html><body>placeholder</body></html>' > "web/dist/src/$d/index.html"; done
      - name: Wait for Spanner emulator
        run: for i in $(seq 1 30); do nc -z 127.0.0.1 9010 && exit 0; sleep 1; done; echo "Spanner emulator did not start" >&2; exit 1
      - run: |
          cargo test -p zitadel-api --test subsystems_backend_boundary
          cargo test -p zitadel-login --test subsystems_backend_boundary
          cargo test -p zitadel-oidc --test subsystems_backend_boundary
          cargo test -p zitadel-server --test subsystems_backend_boundary
          cargo test -p zitadel-storage --test subsystems_storage_postgres_roles
          cargo test -p zitadel-storage --test subsystems_storage_spanner_emulator

  resilience:
    name: Resilience
    if: inputs.run_resilience
    runs-on: ubuntu-latest
    services:
      spanner:
        image: gcr.io/cloud-spanner-emulator/emulator
        ports:
          - 9010:9010
          - 9020:9020
    env:
      ZITADEL_TEST_SPANNER_EMULATOR_HOST: 127.0.0.1:9010
      ZITADEL_TEST_SPANNER_PROJECT: local-project
      ZITADEL_TEST_SPANNER_INSTANCE: test-instance
      ZITADEL_TEST_SPANNER_DATABASE_PREFIX: zitadelrs
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Create web/dist placeholder
        run: |
          mkdir -p web/dist/src/login web/dist/src/console web/dist/src/account web/dist/assets
          for d in login console account; do echo '<!DOCTYPE html><html><body>placeholder</body></html>' > "web/dist/src/$d/index.html"; done
      - name: Wait for Spanner emulator
        run: for i in $(seq 1 30); do nc -z 127.0.0.1 9010 && exit 0; sleep 1; done; echo "Spanner emulator did not start" >&2; exit 1
      - run: cargo test -p zitadel-storage --test resilience_storage_spanner_transient
