name: Reusable CI

on:
  workflow_call:
    inputs:
      execution_tier_label:
        required: false
        type: string
        default: CI
      run_docs:
        required: false
        type: boolean
        default: true
      run_fast_rust:
        required: false
        type: boolean
        default: true
      run_fast_web:
        required: false
        type: boolean
        default: true
      run_journeys_admin:
        required: false
        type: boolean
        default: true
      run_journeys_login:
        required: false
        type: boolean
        default: true
      run_journeys_oidc:
        required: false
        type: boolean
        default: true
      run_journeys_quarantine:
        required: false
        type: boolean
        default: false
      run_contracts:
        required: false
        type: boolean
        default: true
      run_invariants:
        required: false
        type: boolean
        default: true
      run_subsystems:
        required: false
        type: boolean
        default: true
      run_resilience:
        required: false
        type: boolean
        default: false
      artifact_prefix:
        required: false
        type: string
        default: ci

permissions:
  contents: read

jobs:
  noop:
    name: No Lanes
    if: ${{ !inputs.run_docs && !inputs.run_fast_rust && !inputs.run_fast_web && !inputs.run_journeys_admin && !inputs.run_journeys_login && !inputs.run_journeys_oidc && !inputs.run_journeys_quarantine && !inputs.run_contracts && !inputs.run_invariants && !inputs.run_subsystems && !inputs.run_resilience }}
    runs-on: ubuntu-latest
    steps:
      - name: No lanes selected
        run: echo "No reusable CI lanes selected."

  fast-rust-static:
    name: Rust / Static
    if: inputs.run_fast_rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run fast Rust static lane
        run: just rust-static

  fast-rust-tests:
    name: Rust / Tests
    if: inputs.run_fast_rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run fast Rust lane
        run: just test-fast

  fast-docs-check:
    name: Docs / Check
    if: inputs.run_docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run docs checks
        run: just docs-check

  fast-docs-links:
    name: Docs / Links
    if: inputs.run_docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Validate local Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress README.md docs/**/*.md

  fast-web-static:
    name: Web / Static
    if: inputs.run_fast_web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run fast web static lane
        run: just web-static

  fast-web-unit:
    name: Web / Unit
    if: inputs.run_fast_web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run fast web unit lane
        run: just test-web

  prepare-webdist:
    name: Prepare / Web Assets
    if: inputs.run_journeys_admin || inputs.run_journeys_login || inputs.run_journeys_oidc || inputs.run_journeys_quarantine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Build embedded web assets
        run: |
          npm ci --prefer-offline
          just web
          tar -czf webdist.tgz web/dist

      - name: Upload embedded web assets
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ inputs.artifact_prefix }}-webdist
          path: webdist.tgz
          retention-days: 1

  prepare-rust-binary:
    name: Prepare / Zitadel Binary
    if: inputs.run_journeys_admin || inputs.run_journeys_login || inputs.run_journeys_oidc || inputs.run_journeys_quarantine
    needs: prepare-webdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Restore embedded web assets
        uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ inputs.artifact_prefix }}-webdist
          path: .

      - name: Extract embedded web assets
        run: tar -xzf webdist.tgz

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build zitadel binary
        run: cargo build -p zitadel

      - name: Package zitadel binary
        run: |
          mkdir -p artifacts/prepare-rust-binary
          tar -czf artifacts/prepare-rust-binary/zitadel-debug.tgz -C target/debug zitadel

      - name: Upload zitadel binary artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ inputs.artifact_prefix }}-zitadel-binary
          path: artifacts/prepare-rust-binary/zitadel-debug.tgz
          retention-days: 1

  contracts:
    name: Contracts
    if: inputs.run_contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run contract suites
        run: just contracts

  invariants:
    name: Invariants
    if: inputs.run_invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run invariant suites
        run: just invariants

  subsystems:
    name: Subsystems
    if: inputs.run_subsystems
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ZITADEL_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run subsystem suites
        run: just subsystems

  resilience:
    name: Resilience
    if: inputs.run_resilience
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run resilience suites
        run: just resilience

  journeys-admin:
    name: Journeys / Admin
    if: inputs.run_journeys_admin
    needs: prepare-rust-binary
    runs-on: ubuntu-latest
    env:
      CI_TMP_DIR: ${{ github.workspace }}/.ci-tmp
      ZITADEL_BROWSER_TESTS_BINARY: ${{ github.workspace }}/.ci-tmp/zitadel-bin/zitadel
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Restore zitadel binary
        uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ inputs.artifact_prefix }}-zitadel-binary
          path: .

      - name: Extract zitadel binary
        run: |
          mkdir -p "$CI_TMP_DIR/zitadel-bin"
          tar -xzf zitadel-debug.tgz -C "$CI_TMP_DIR/zitadel-bin"

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run admin journey suite
        run: npm run test:journeys:admin -w browser-tests -- --reporter=github,line,html

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ inputs.artifact_prefix }}-journeys-admin-report
          path: |
            browser-tests/playwright-report
            browser-tests/test-results
          if-no-files-found: warn
          retention-days: 7

  journeys-login:
    name: Journeys / Login
    if: inputs.run_journeys_login
    needs: prepare-rust-binary
    runs-on: ubuntu-latest
    env:
      CI_TMP_DIR: ${{ github.workspace }}/.ci-tmp
      ZITADEL_BROWSER_TESTS_BINARY: ${{ github.workspace }}/.ci-tmp/zitadel-bin/zitadel
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Restore zitadel binary
        uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ inputs.artifact_prefix }}-zitadel-binary
          path: .

      - name: Extract zitadel binary
        run: |
          mkdir -p "$CI_TMP_DIR/zitadel-bin"
          tar -xzf zitadel-debug.tgz -C "$CI_TMP_DIR/zitadel-bin"

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run login journey suite
        run: npm run test:journeys:login -w browser-tests -- --reporter=github,line,html

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ inputs.artifact_prefix }}-journeys-login-report
          path: |
            browser-tests/playwright-report
            browser-tests/test-results
          if-no-files-found: warn
          retention-days: 7

  journeys-oidc:
    name: Journeys / OIDC
    if: inputs.run_journeys_oidc
    needs: prepare-rust-binary
    runs-on: ubuntu-latest
    env:
      CI_TMP_DIR: ${{ github.workspace }}/.ci-tmp
      ZITADEL_BROWSER_TESTS_BINARY: ${{ github.workspace }}/.ci-tmp/zitadel-bin/zitadel
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Restore zitadel binary
        uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ inputs.artifact_prefix }}-zitadel-binary
          path: .

      - name: Extract zitadel binary
        run: |
          mkdir -p "$CI_TMP_DIR/zitadel-bin"
          tar -xzf zitadel-debug.tgz -C "$CI_TMP_DIR/zitadel-bin"

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run OIDC journey suite
        run: npm run test:journeys:oidc -w browser-tests -- --reporter=github,line,html

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ inputs.artifact_prefix }}-journeys-oidc-report
          path: |
            browser-tests/playwright-report
            browser-tests/test-results
          if-no-files-found: warn
          retention-days: 7

  journeys-quarantine:
    name: Journeys / Quarantine
    if: inputs.run_journeys_quarantine
    needs: prepare-rust-binary
    runs-on: ubuntu-latest
    env:
      CI_TMP_DIR: ${{ github.workspace }}/.ci-tmp
      ZITADEL_BROWSER_TESTS_BINARY: ${{ github.workspace }}/.ci-tmp/zitadel-bin/zitadel
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Restore zitadel binary
        uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ inputs.artifact_prefix }}-zitadel-binary
          path: .

      - name: Extract zitadel binary
        run: |
          mkdir -p "$CI_TMP_DIR/zitadel-bin"
          tar -xzf zitadel-debug.tgz -C "$CI_TMP_DIR/zitadel-bin"

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run quarantined browser journeys
        run: npm run test:journeys:quarantine -w browser-tests -- --reporter=github,line,html

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ inputs.artifact_prefix }}-journeys-quarantine-report
          path: |
            browser-tests/playwright-report
            browser-tests/test-results
          if-no-files-found: warn
          retention-days: 7
