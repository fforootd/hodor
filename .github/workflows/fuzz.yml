name: Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group:
          - login-api
          - session-auth
          - id-logging
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Create placeholder webdist
        run: make ensure-webdist

      - name: Run fuzz targets
        run: |
          run_fuzz() {
            local name="$1"
            local pkg="$2"
            echo "::group::$name"
            go test -fuzz "^${name}$" -fuzztime 60s "$pkg"
            echo "::endgroup::"
          }

          case "${{ matrix.group }}" in
            login-api)
              run_fuzz FuzzParseIDTokenClaims ./internal/login/
              run_fuzz FuzzMapClaims ./internal/login/
              run_fuzz FuzzAPIJSON ./internal/api/
              run_fuzz FuzzSessionToken ./internal/api/
              run_fuzz FuzzBearerTokenResolution ./internal/api/
              run_fuzz FuzzCookieTokenResolution ./internal/api/
              run_fuzz FuzzXIdentityIdHeader ./internal/api/
              ;;
            session-auth)
              run_fuzz FuzzCookieVerify ./internal/session/
              run_fuzz FuzzCookieSign ./internal/session/
              run_fuzz FuzzCookieSignVerifyRoundTrip ./internal/session/
              run_fuzz FuzzExtractHash ./internal/auth/
              run_fuzz FuzzPasswordHash ./internal/auth/
              ;;
            id-logging)
              run_fuzz FuzzNew ./internal/id/
              run_fuzz FuzzRedactor_IsSensitive ./internal/logging/
              run_fuzz FuzzRedactor_RedactRecord ./internal/logging/
              run_fuzz FuzzRedactor_RedactValue_Group ./internal/logging/
              run_fuzz FuzzCircuitBreaker ./internal/logging/
              run_fuzz FuzzFanOutHandler ./internal/logging/
              ;;
          esac
