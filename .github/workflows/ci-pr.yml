name: CI / PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Stable Wall
    uses: ./.github/workflows/reusable-ci.yml
    with:
      execution_tier_label: PR
      run_docs: true
      run_fast_rust: true
      run_fast_web: true
      run_journeys_admin: true
      run_journeys_login: true
      run_journeys_oidc: true
      run_journeys_quarantine: false
      run_contracts: true
      run_invariants: true
      run_subsystems: true
      run_resilience: false
      artifact_prefix: pr
