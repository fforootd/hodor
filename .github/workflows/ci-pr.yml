name: CI PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@v3.0.2
        with:
          filters: |
            go:
              - 'cmd/**'
              - 'internal/**'
              - 'fixtures/**'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - '.goreleaser.yml'
              - 'Dockerfile.goreleaser'
              - '.github/workflows/**'
            web:
              - 'web/**'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
            browser:
              - 'cmd/**'
              - 'internal/**'
              - 'fixtures/**'
              - 'web/**'
              - 'e2e/**'
              - 'go.mod'
              - 'go.sum'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
              - 'Makefile'
              - '.goreleaser.yml'
              - 'Dockerfile.goreleaser'
              - '.github/workflows/**'

  prepare-webdist:
    name: Prepare Webdist
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.browser == 'true'
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build embedded web assets
        run: |
          npm ci --prefer-offline
          npm run build
          make webdist-only
          tar -czf webdist.tgz internal/server/webdist

      - name: Upload embedded web assets
        uses: actions/upload-artifact@v4.6.2
        with:
          name: webdist
          path: webdist.tgz
          retention-days: 1

  go-static:
    name: Go Static
    runs-on: ubuntu-latest
    needs: [changes, prepare-webdist]
    if: needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Restore embedded web assets
        uses: actions/download-artifact@v4.3.0
        with:
          name: webdist
          path: .

      - name: Extract embedded web assets
        run: tar -xzf webdist.tgz

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.2.0
        with:
          version-file: .golangci-lint-version

      - name: Check formatting
        run: make fmt-check

  go-sqlite:
    name: Go SQLite
    runs-on: ubuntu-latest
    needs: [changes, prepare-webdist]
    if: needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Restore embedded web assets
        uses: actions/download-artifact@v4.3.0
        with:
          name: webdist
          path: .

      - name: Extract embedded web assets
        run: tar -xzf webdist.tgz

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Go
        run: go build ./...

      - name: Test Go with SQLite
        run: go test -race -count=1 -timeout 240s -cover ./...

  web-static:
    name: Web Static
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Lint web
        run: npm run lint -w web

      - name: Typecheck web
        run: npm run typecheck -w web

  web-unit:
    name: Web Unit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run Vitest
        run: npm test -w web

  postgres-latest:
    name: Postgres Latest
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    env:
      TEST_POSTGRES_VERSION: "18"
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test Postgres integration
        run: go test -v -count=1 -timeout 300s -cover ./internal/database/...

  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    needs: [changes, prepare-webdist]
    if: needs.changes.outputs.browser == 'true'
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Restore embedded web assets
        uses: actions/download-artifact@v4.3.0
        with:
          name: webdist
          path: .

      - name: Extract embedded web assets
        run: tar -xzf webdist.tgz

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Playwright browsers
        uses: actions/cache@v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        run: npm run test:smoke -w e2e -- --reporter=line
