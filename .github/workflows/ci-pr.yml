name: CI PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      e2e: ${{ steps.filter.outputs.e2e }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@v3.0.2
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'migrations/**'
              - 'fixtures/**'
              - 'Makefile'
              - 'zitadel.reference.toml'
            web:
              - 'web/**'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
            e2e:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'fixtures/**'
              - 'web/**'
              - 'e2e/**'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
              - 'Makefile'
              - '.github/workflows/**'
            docs:
              - 'README.md'
              - 'docs/**'
              - '.github/workflows/**'
              - 'Makefile'

  rust-static:
    name: Rust Static
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Ensure embedded web placeholder exists
        run: make ensure-webdist

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

  rust-test:
    name: Rust Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Ensure embedded web placeholder exists
        run: make ensure-webdist

      - name: Run cargo test
        run: cargo test --workspace

  docs-check:
    name: Docs Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Run stale-command checks
        run: make docs-check

  docs-links:
    name: Docs Links
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Validate local Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress README.md docs/**/*.md

  prepare-webdist:
    name: Prepare Webdist
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build embedded web assets
        run: |
          npm ci --prefer-offline
          make web
          tar -czf webdist.tgz web/dist

      - name: Upload embedded web assets
        uses: actions/upload-artifact@v4.6.2
        with:
          name: webdist
          path: webdist.tgz
          retention-days: 1

  web-static:
    name: Web Static
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Lint web
        run: npm run lint -w web

      - name: Typecheck web
        run: npm run typecheck -w web

  web-unit:
    name: Web Unit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run Vitest
        run: npm test -w web

  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    needs: [changes, prepare-webdist]
    if: needs.changes.outputs.e2e == 'true'
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Restore embedded web assets
        uses: actions/download-artifact@v4.3.0
        with:
          name: webdist
          path: .

      - name: Extract embedded web assets
        run: tar -xzf webdist.tgz

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build zitadel binary
        run: cargo build -p zitadel

      - name: Run Playwright smoke tests
        run: npm run test:smoke -w e2e -- --reporter=line
