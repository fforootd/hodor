name: CI PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: PR / Stable Wall
    uses: ./.github/workflows/reusable-ci.yml
    with:
      execution_tier_label: PR
      run_docs: true
      run_fast_rust: true
      run_fast_web: true
      run_journeys_admin: true
      run_journeys_login: true
      run_journeys_oidc: true
      run_journeys_quarantine: false
      run_contracts: true
      run_invariants: true
      run_subsystems: true
      run_resilience: false
      artifact_prefix: pr

  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      terraform_gcp: ${{ steps.filter.outputs.terraform_gcp }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@v3.0.2
        with:
          filters: |
            terraform_gcp:
              - 'deploy/gcp-cloud-run/**'
              - '.github/workflows/ci-pr.yml'

  terraform-gcp-cloud-run:
    name: Terraform GCP Cloud Run
    needs: changes
    if: needs.changes.outputs.terraform_gcp == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/gcp-cloud-run
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Init providers
        run: terraform init -backend=false

      - name: Validate configuration
        run: terraform validate
