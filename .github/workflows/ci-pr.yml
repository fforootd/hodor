name: CI PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      fast_rust: ${{ steps.filter.outputs.fast_rust }}
      fast_web: ${{ steps.filter.outputs.fast_web }}
      extended_e2e: ${{ steps.filter.outputs.extended_e2e }}
      compliance_oidc: ${{ steps.filter.outputs.compliance_oidc }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@v3.0.2
        with:
          filters: |
            fast_rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'migrations/**'
              - 'fixtures/**'
              - 'justfile'
              - 'zitadel.reference.toml'
            fast_web:
              - 'web/**'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
            extended_e2e:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'migrations/**'
              - 'fixtures/**'
              - 'web/**'
              - 'e2e/**'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
              - 'justfile'
              - '.github/workflows/reusable-ci.yml'
              - '.github/workflows/ci-pr.yml'
              - '.github/workflows/ci-main.yml'
            compliance_oidc:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'migrations/**'
              - 'fixtures/**'
              - 'conformance/**'
              - 'web/**'
              - 'e2e/**'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
              - 'justfile'
              - 'Dockerfile'
              - '.github/workflows/reusable-ci.yml'
              - '.github/workflows/ci-pr.yml'
              - '.github/workflows/oidc-conformance-daily.yml'
            docs:
              - 'README.md'
              - 'docs/**'
              - '.github/workflows/**'
              - 'justfile'

  ci:
    name: Fast And Extended CI
    needs: changes
    uses: ./.github/workflows/reusable-ci.yml
    with:
      run_docs: ${{ needs.changes.outputs.docs == 'true' }}
      run_fast_rust: ${{ needs.changes.outputs.fast_rust == 'true' }}
      run_fast_web: ${{ needs.changes.outputs.fast_web == 'true' }}
      run_extended_e2e: ${{ needs.changes.outputs.extended_e2e == 'true' }}
      run_browser_artifacts: ${{ needs.changes.outputs.extended_e2e == 'true' }}
      run_fuzz: ${{ needs.changes.outputs.fast_rust == 'true' }}
      artifact_prefix: pr

  prepare-compliance-browser-artifacts:
    name: Prepare Compliance Browser Artifacts
    needs: changes
    if: needs.changes.outputs.compliance_oidc == 'true'
    uses: ./.github/workflows/reusable-ci.yml
    with:
      run_docs: false
      run_fast_rust: false
      run_fast_web: false
      run_extended_e2e: false
      run_browser_artifacts: true
      artifact_prefix: compliance-oidc

  prepare-conformance-image:
    name: Prepare Conformance Image
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.compliance_oidc == 'true'
    outputs:
      image_tag: ${{ steps.image_meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v6.0.2

      - id: image_meta
        name: Set image metadata
        run: echo "image_tag=zitadel-oidc-conformance:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Create CI temp directory
        run: mkdir -p "$GITHUB_WORKSPACE/.ci-tmp"

      - uses: docker/setup-buildx-action@v3

      - name: Build conformance image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ steps.image_meta.outputs.image_tag }}
          outputs: type=docker,dest=${{ github.workspace }}/.ci-tmp/zitadel-oidc-conformance.tar
          cache-from: type=gha,scope=compliance-oidc-image
          cache-to: type=gha,mode=max,scope=compliance-oidc-image

      - name: Compress conformance image
        run: gzip -1 "$GITHUB_WORKSPACE/.ci-tmp/zitadel-oidc-conformance.tar"

      - name: Upload conformance image artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: compliance-oidc-image
          path: ${{ github.workspace }}/.ci-tmp/zitadel-oidc-conformance.tar.gz
          retention-days: 1

  compliance-oidc:
    name: Compliance OIDC
    runs-on: ubuntu-latest
    needs:
      - changes
      - prepare-compliance-browser-artifacts
      - prepare-conformance-image
    if: always() && needs.changes.outputs.compliance_oidc == 'true'
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      status: ${{ steps.summarize.outputs.overall_status }}
      artifact-id: ${{ steps.upload_artifact.outputs.artifact-id }}
      artifact-url: ${{ steps.upload_artifact.outputs.artifact-url }}
    env:
      OIDC_CONFORMANCE_SURFACE: both
      OIDC_CONFORMANCE_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/oidc-conformance
      OIDC_CONFORMANCE_SUMMARY_MD: ${{ github.workspace }}/artifacts/oidc-conformance/summary.md
      OIDC_CONFORMANCE_SUMMARY_JSON: ${{ github.workspace }}/artifacts/oidc-conformance/summary.json
      OIDC_CONFORMANCE_COMMENT_MD: ${{ github.workspace }}/artifacts/oidc-conformance/comment.md
      CI_TMP_DIR: ${{ github.workspace }}/.ci-tmp
      ZITADEL_E2E_BINARY: ${{ github.workspace }}/.ci-tmp/zitadel-bin/zitadel
      OIDC_CONFORMANCE_ZITADEL_IMAGE: ${{ needs.prepare-conformance-image.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Check prepared compliance artifacts
        id: preflight
        continue-on-error: true
        run: |
          test "${{ needs.prepare-compliance-browser-artifacts.result }}" = "success"
          test "${{ needs.prepare-conformance-image.result }}" = "success"

      - name: Restore prepared zitadel binary
        if: steps.preflight.outcome == 'success'
        uses: actions/download-artifact@v4.3.0
        with:
          name: compliance-oidc-zitadel-binary
          path: .

      - name: Extract prepared zitadel binary
        if: steps.preflight.outcome == 'success'
        run: |
          mkdir -p "$CI_TMP_DIR/zitadel-bin"
          tar -xzf zitadel-debug.tgz -C "$CI_TMP_DIR/zitadel-bin"

      - name: Restore prepared conformance image
        if: steps.preflight.outcome == 'success'
        uses: actions/download-artifact@v4.3.0
        with:
          name: compliance-oidc-image
          path: ${{ github.workspace }}/.ci-tmp/compliance-image

      - name: Load prepared conformance image
        if: steps.preflight.outcome == 'success'
        run: gunzip -c "$CI_TMP_DIR/compliance-image/zitadel-oidc-conformance.tar.gz" | docker load

      - uses: actions/setup-node@v6.3.0
        if: steps.preflight.outcome == 'success'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Playwright browsers
        if: steps.preflight.outcome == 'success'
        uses: actions/cache@v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        if: steps.preflight.outcome == 'success'
        run: npm ci --prefer-offline

      - name: Install Chromium
        if: steps.preflight.outcome == 'success'
        run: npx playwright install --with-deps chromium

      - name: Run Compliance OIDC
        id: run_conformance
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        run: just oidc-conformance

      - name: Resolve compliance run status
        if: always()
        id: run_status
        run: |
          status="${{ steps.run_conformance.outcome }}"
          if [[ "${{ steps.preflight.outcome }}" != "success" ]]; then
            status="failure"
          fi
          echo "value=$status" >> "$GITHUB_OUTPUT"

      - name: Summarize Compliance OIDC
        if: always()
        id: summarize
        run: |
          python3 conformance/oidc/scripts/summarize-results.py \
            --artifact-root "$OIDC_CONFORMANCE_ARTIFACTS_DIR" \
            --surface "$OIDC_CONFORMANCE_SURFACE" \
            --run-status "${{ steps.run_status.outputs.value }}" \
            --markdown-out "$OIDC_CONFORMANCE_SUMMARY_MD" \
            --json-out "$OIDC_CONFORMANCE_SUMMARY_JSON" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload Compliance OIDC artifacts
        if: always()
        id: upload_artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: compliance-oidc-pr-${{ github.event.pull_request.number }}
          path: artifacts/oidc-conformance
          if-no-files-found: warn
          retention-days: 7

      - name: Compose Compliance OIDC comment
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.upload_artifact.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cp "$OIDC_CONFORMANCE_SUMMARY_MD" "$OIDC_CONFORMANCE_COMMENT_MD"
          printf '\n- Workflow run: [view](%s)\n' "$RUN_URL" >> "$OIDC_CONFORMANCE_COMMENT_MD"
          if [[ -n "$ARTIFACT_URL" ]]; then
            printf -- '- Artifact: [download](%s)\n' "$ARTIFACT_URL" >> "$OIDC_CONFORMANCE_COMMENT_MD"
          fi

      - name: Publish Compliance OIDC summary
        if: always()
        run: cat "$OIDC_CONFORMANCE_COMMENT_MD" >> "$GITHUB_STEP_SUMMARY"

      - name: Update Compliance OIDC PR comment
        if: always() && github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@v8
        env:
          COMMENT_PATH: ${{ env.OIDC_CONFORMANCE_COMMENT_MD }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- compliance-oidc-report -->';
            const body = `${marker}\n${fs.readFileSync(process.env.COMMENT_PATH, 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Fail if Compliance OIDC failed
        if: always() && (steps.preflight.outcome != 'success' || steps.run_conformance.outcome != 'success')
        run: exit 1
