name: CI PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      e2e: ${{ steps.filter.outputs.e2e }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@v3.0.2
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'migrations/**'
              - 'fixtures/**'
              - 'Makefile'
              - 'zitadel.reference.toml'
            web:
              - 'web/**'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
            e2e:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'fixtures/**'
              - 'web/**'
              - 'e2e/**'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
              - 'Makefile'
              - '.github/workflows/**'
            docs:
              - 'README.md'
              - 'docs/**'
              - '.github/workflows/**'
              - 'Makefile'

  ci:
    name: CI
    needs: changes
    uses: ./.github/workflows/reusable-ci.yml
    with:
      run_docs: ${{ needs.changes.outputs.docs == 'true' }}
      run_e2e: ${{ needs.changes.outputs.e2e == 'true' }}
      run_rust: ${{ needs.changes.outputs.rust == 'true' }}
      run_web: ${{ needs.changes.outputs.web == 'true' }}
