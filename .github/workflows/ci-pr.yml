name: CI PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      fast_rust: ${{ steps.filter.outputs.fast_rust }}
      fast_web: ${{ steps.filter.outputs.fast_web }}
      journeys: ${{ steps.filter.outputs.journeys }}
      journeys_oidc: ${{ steps.filter.outputs.journeys_oidc }}
      contracts: ${{ steps.filter.outputs.contracts }}
      invariants: ${{ steps.filter.outputs.invariants }}
      subsystems: ${{ steps.filter.outputs.subsystems }}
      conformance_oidc: ${{ steps.filter.outputs.conformance_oidc }}
      docs: ${{ steps.filter.outputs.docs }}
      terraform_gcp: ${{ steps.filter.outputs.terraform_gcp }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@v3.0.2
        with:
          filters: |
            fast_rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'migrations/**'
              - 'fixtures/**'
              - 'justfile'
              - 'zitadel.reference.toml'
            fast_web:
              - 'web/**'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
            journeys:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'migrations/**'
              - 'fixtures/**'
              - 'web/**'
              - 'browser-tests/journeys/admin/**'
              - 'browser-tests/support/**'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
              - 'justfile'
              - '.github/workflows/reusable-ci.yml'
              - '.github/workflows/ci-pr.yml'
              - '.github/workflows/ci-main.yml'
            journeys_oidc:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/zitadel-api/**'
              - 'crates/zitadel-authn/**'
              - 'crates/zitadel-login/**'
              - 'crates/zitadel-oidc/**'
              - 'crates/zitadel-server/**'
              - 'migrations/**'
              - 'fixtures/**'
              - 'web/**'
              - 'browser-tests/journeys/login/**'
              - 'browser-tests/support/**'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
              - 'justfile'
              - '.github/workflows/reusable-ci.yml'
              - '.github/workflows/ci-pr.yml'
              - '.github/workflows/ci-main.yml'
            contracts:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/zitadel-server/**'
              - 'crates/**/tests/contracts_*'
              - 'fixtures/**'
              - 'migrations/**'
              - 'justfile'
              - '.github/workflows/reusable-ci.yml'
              - '.github/workflows/ci-pr.yml'
              - '.github/workflows/ci-main.yml'
            invariants:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/zitadel-fga/**'
              - 'crates/zitadel-server/**'
              - 'crates/**/tests/invariants_*'
              - 'fixtures/**'
              - 'migrations/**'
              - 'justfile'
              - '.github/workflows/reusable-ci.yml'
              - '.github/workflows/ci-pr.yml'
              - '.github/workflows/ci-main.yml'
            subsystems:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/zitadel-api/**'
              - 'crates/zitadel-login/**'
              - 'crates/zitadel-oidc/**'
              - 'crates/zitadel-server/**'
              - 'crates/zitadel-storage/**'
              - 'crates/**/tests/subsystems_*'
              - 'fixtures/**'
              - 'migrations/**'
              - 'justfile'
              - '.github/workflows/reusable-ci.yml'
              - '.github/workflows/ci-pr.yml'
              - '.github/workflows/ci-main.yml'
            conformance_oidc:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/zitadel-api/**'
              - 'crates/zitadel-authn/**'
              - 'crates/zitadel-login/**'
              - 'crates/zitadel-oidc/**'
              - 'crates/zitadel-server/**'
              - 'migrations/**'
              - 'fixtures/**'
              - 'conformance/**'
              - 'web/**'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
              - 'justfile'
              - 'Dockerfile'
              - '.github/workflows/reusable-ci.yml'
              - '.github/workflows/ci-pr.yml'
              - '.github/workflows/oidc-conformance-daily.yml'
            docs:
              - 'README.md'
              - 'docs/**'
              - '.github/workflows/**'
              - 'justfile'
            terraform_gcp:
              - 'deploy/gcp-cloud-run/**'
              - '.github/workflows/ci-pr.yml'

  ci:
    name: PR / Fast And Families
    needs: changes
    uses: ./.github/workflows/reusable-ci.yml
    with:
      execution_tier_label: PR
      run_docs: ${{ needs.changes.outputs.docs == 'true' }}
      run_fast_rust: ${{ needs.changes.outputs.fast_rust == 'true' }}
      run_fast_web: ${{ needs.changes.outputs.fast_web == 'true' }}
      run_journeys: ${{ needs.changes.outputs.journeys == 'true' }}
      run_journeys_oidc: ${{ needs.changes.outputs.journeys_oidc == 'true' }}
      run_contracts: ${{ needs.changes.outputs.contracts == 'true' }}
      run_invariants: ${{ needs.changes.outputs.invariants == 'true' }}
      run_subsystems: ${{ needs.changes.outputs.subsystems == 'true' }}
      run_conformance_oidc: ${{ needs.changes.outputs.conformance_oidc == 'true' }}
      run_browser_artifacts: ${{ needs.changes.outputs.journeys == 'true' || needs.changes.outputs.journeys_oidc == 'true' }}
      run_fuzz: ${{ needs.changes.outputs.fast_rust == 'true' }}
      artifact_prefix: pr

  terraform-gcp-cloud-run:
    name: Terraform GCP Cloud Run
    needs: changes
    if: needs.changes.outputs.terraform_gcp == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/gcp-cloud-run
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Init providers
        run: terraform init -backend=false

      - name: Validate configuration
        run: terraform validate

  prepare-conformance-image:
    name: PR / Prepare / Conformance Image
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.conformance_oidc == 'true'
    outputs:
      image_tag: ${{ steps.image_meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v6.0.2

      - id: image_meta
        name: Set image metadata
        run: echo "image_tag=zitadel-oidc-conformance:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Create CI temp directory
        run: mkdir -p "$GITHUB_WORKSPACE/.ci-tmp"

      - uses: docker/setup-buildx-action@v3

      - name: Build conformance image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ steps.image_meta.outputs.image_tag }}
          outputs: type=docker,dest=${{ github.workspace }}/.ci-tmp/zitadel-oidc-conformance.tar
          cache-from: type=gha,scope=oidc-protocol-compliance-image
          cache-to: type=gha,mode=max,scope=oidc-protocol-compliance-image

      - name: Compress conformance image
        run: gzip -1 "$GITHUB_WORKSPACE/.ci-tmp/zitadel-oidc-conformance.tar"

      - name: Upload conformance image artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: oidc-protocol-compliance-image
          path: ${{ github.workspace }}/.ci-tmp/zitadel-oidc-conformance.tar.gz
          retention-days: 1

  oidc-protocol-compliance:
    name: PR / Conformance / OIDC
    runs-on: ubuntu-latest
    needs:
      - changes
      - prepare-conformance-image
    if: always() && needs.changes.outputs.conformance_oidc == 'true'
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      status: ${{ steps.summarize.outputs.overall_status }}
      artifact-id: ${{ steps.upload_artifact.outputs.artifact-id }}
      artifact-url: ${{ steps.upload_artifact.outputs.artifact-url }}
    env:
      OIDC_CONFORMANCE_SURFACE: op
      OIDC_CONFORMANCE_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/oidc-conformance
      OIDC_CONFORMANCE_SUMMARY_MD: ${{ github.workspace }}/artifacts/oidc-conformance/summary.md
      OIDC_CONFORMANCE_SUMMARY_JSON: ${{ github.workspace }}/artifacts/oidc-conformance/summary.json
      OIDC_CONFORMANCE_COMMENT_MD: ${{ github.workspace }}/artifacts/oidc-conformance/comment.md
      CI_TMP_DIR: ${{ github.workspace }}/.ci-tmp
      OIDC_CONFORMANCE_ZITADEL_IMAGE: ${{ needs.prepare-conformance-image.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Check prepared compliance artifacts
        id: preflight
        continue-on-error: true
        run: |
          test "${{ needs.prepare-conformance-image.result }}" = "success"

      - name: Restore prepared conformance image
        if: steps.preflight.outcome == 'success'
        uses: actions/download-artifact@v4.3.0
        with:
          name: oidc-protocol-compliance-image
          path: ${{ github.workspace }}/.ci-tmp/compliance-image

      - name: Load prepared conformance image
        if: steps.preflight.outcome == 'success'
        run: gunzip -c "$CI_TMP_DIR/compliance-image/zitadel-oidc-conformance.tar.gz" | docker load

      - name: Run OIDC Protocol Compliance
        id: run_conformance
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        run: just conformance-oidc

      - name: Resolve compliance run status
        if: always()
        id: run_status
        run: |
          status="${{ steps.run_conformance.outcome }}"
          if [[ "${{ steps.preflight.outcome }}" != "success" ]]; then
            status="failure"
          fi
          echo "value=$status" >> "$GITHUB_OUTPUT"

      - name: Summarize OIDC Protocol Compliance
        if: always()
        id: summarize
        run: |
          python3 conformance/oidc/scripts/summarize-results.py \
            --artifact-root "$OIDC_CONFORMANCE_ARTIFACTS_DIR" \
            --surface "$OIDC_CONFORMANCE_SURFACE" \
            --run-status "${{ steps.run_status.outputs.value }}" \
            --markdown-out "$OIDC_CONFORMANCE_SUMMARY_MD" \
            --json-out "$OIDC_CONFORMANCE_SUMMARY_JSON" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload OIDC Protocol Compliance artifacts
        if: always()
        id: upload_artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: pr-conformance-oidc-${{ github.event.pull_request.number }}
          path: artifacts/oidc-conformance
          if-no-files-found: warn
          retention-days: 7

      - name: Compose OIDC Protocol Compliance comment
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.upload_artifact.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cp "$OIDC_CONFORMANCE_SUMMARY_MD" "$OIDC_CONFORMANCE_COMMENT_MD"
          printf '\n- Workflow run: [view](%s)\n' "$RUN_URL" >> "$OIDC_CONFORMANCE_COMMENT_MD"
          if [[ -n "$ARTIFACT_URL" ]]; then
            printf -- '- Artifact: [download](%s)\n' "$ARTIFACT_URL" >> "$OIDC_CONFORMANCE_COMMENT_MD"
          fi

      - name: Publish OIDC Protocol Compliance summary
        if: always()
        run: cat "$OIDC_CONFORMANCE_COMMENT_MD" >> "$GITHUB_STEP_SUMMARY"

      - name: Update OIDC Protocol Compliance PR comment
        if: always() && github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@v8
        env:
          COMMENT_PATH: ${{ env.OIDC_CONFORMANCE_COMMENT_MD }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- oidc-protocol-compliance-report -->';
            const body = `${marker}\n${fs.readFileSync(process.env.COMMENT_PATH, 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Fail if OIDC Protocol Compliance failed
        if: always() && (steps.preflight.outcome != 'success' || steps.run_conformance.outcome != 'success')
        run: exit 1
