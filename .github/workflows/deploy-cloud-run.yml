name: Deploy / Cloud Run

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. sha-abc1234, latest, v1.0.0)"
        required: true
        default: latest
        type: string
      environment:
        description: "Target environment"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      run_migrations:
        description: "Run schema migrations before deploying"
        required: true
        default: true
        type: boolean

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  AR_REGION: ${{ vars.AR_REGION || 'us-central1' }}
  AR_REPOSITORY: ${{ vars.AR_REPOSITORY || 'zitadel' }}
  IMAGE_NAME: zitadel

jobs:
  deploy:
    name: Deploy / ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Compute image reference
        id: image
        run: |
          registry="${AR_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}"
          full="${registry}/${IMAGE_NAME}:${{ inputs.image_tag }}"
          echo "ref=${full}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ZITADEL_COOKIE_SECRETS: "op://Zitadel/cookie-secrets-${{ inputs.environment }}/secret"
          ZITADEL_ENCRYPTION__ACTIVE_KEY_ID: "op://Zitadel/encryption-key-${{ inputs.environment }}/key-id"
          ZITADEL_ENCRYPTION__KEYS__0__ID: "op://Zitadel/encryption-key-${{ inputs.environment }}/key-id"
          ZITADEL_ENCRYPTION__KEYS__0__SECRET: "op://Zitadel/encryption-key-${{ inputs.environment }}/secret"
          ZITADEL_CLOUD__LICENSE_KEY: "op://Zitadel/cloud-license-${{ inputs.environment }}/key"
          ZITADEL_SERVER__MANAGEMENT_SECRET: "op://Zitadel/management-secret-${{ inputs.environment }}/secret"

      - name: Verify image exists
        run: |
          gcloud artifacts docker images describe "${{ steps.image.outputs.ref }}" \
            --project="${GCP_PROJECT_ID}" \
            || { echo "::error::Image not found: ${{ steps.image.outputs.ref }}"; exit 1; }

      - name: Build secret env vars string
        id: secrets
        run: |
          secrets=""
          for var in ZITADEL_COOKIE_SECRETS \
                     ZITADEL_ENCRYPTION__ACTIVE_KEY_ID \
                     ZITADEL_ENCRYPTION__KEYS__0__ID \
                     ZITADEL_ENCRYPTION__KEYS__0__SECRET \
                     ZITADEL_CLOUD__LICENSE_KEY \
                     ZITADEL_SERVER__MANAGEMENT_SECRET; do
            val="${!var}"
            echo "::add-mask::${val}"
            if [ -n "$secrets" ]; then secrets="${secrets},"; fi
            secrets="${secrets}${var}=${val}"
          done
          echo "env_vars=${secrets}" >> "$GITHUB_OUTPUT"

      - name: Run migrations
        if: inputs.run_migrations
        env:
          MIGRATE_JOB: ${{ vars.CLOUD_RUN_MIGRATE_JOB || format('zitadel-migrate-{0}', inputs.environment) }}
          REGION: ${{ vars.CLOUD_RUN_REGION || env.AR_REGION }}
        run: |
          gcloud run jobs update "${MIGRATE_JOB}" \
            --image="${{ steps.image.outputs.ref }}" \
            --update-env-vars="${{ steps.secrets.outputs.env_vars }}" \
            --region="${REGION}" \
            --project="${GCP_PROJECT_ID}"

          gcloud run jobs execute "${MIGRATE_JOB}" \
            --region="${REGION}" \
            --project="${GCP_PROJECT_ID}" \
            --wait

      - name: Deploy service
        id: deploy
        env:
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE || format('zitadel-{0}', inputs.environment) }}
          REGION: ${{ vars.CLOUD_RUN_REGION || env.AR_REGION }}
        run: |
          gcloud run services update "${SERVICE}" \
            --image="${{ steps.image.outputs.ref }}" \
            --update-env-vars="${{ steps.secrets.outputs.env_vars }}" \
            --region="${REGION}" \
            --project="${GCP_PROJECT_ID}"

          url="$(gcloud run services describe "${SERVICE}" \
            --region="${REGION}" \
            --project="${GCP_PROJECT_ID}" \
            --format='value(status.url)')"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Health check
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for i in 1 2 3 4 5; do
            status="$(curl -s -o /dev/null -w '%{http_code}' "${SERVICE_URL}/healthz" || true)"
            if [[ "$status" == "200" ]]; then
              echo "Health check passed"
              break
            fi
            echo "Attempt ${i}: HTTP ${status}, retrying in 10s..."
            sleep 10
          done

      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Deployment Complete

          | Field | Value |
          |-------|-------|
          | Environment | \`${{ inputs.environment }}\` |
          | Image | \`${{ steps.image.outputs.ref }}\` |
          | Service URL | ${{ steps.deploy.outputs.url }} |
          | Migrations | ${{ inputs.run_migrations && '✅ ran' || '⏭️ skipped' }} |
          EOF
