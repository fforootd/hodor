name: Release CI

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Release / Fast And Families
    uses: ./.github/workflows/reusable-ci.yml
    with:
      execution_tier_label: Release
      run_docs: true
      run_fast_rust: true
      run_fast_web: true
      run_journeys: true
      run_journeys_oidc: true
      run_contracts: true
      run_invariants: true
      run_subsystems: true
      run_browser_artifacts: true
      artifact_prefix: main
