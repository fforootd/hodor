name: CI Main

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_LATEST: "18"

permissions:
  contents: read

jobs:
  prepare-webdist:
    name: Prepare Webdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build embedded web assets
        run: |
          npm ci --prefer-offline
          npm run build
          make webdist-only
          tar -czf webdist.tgz internal/server/webdist

      - name: Upload embedded web assets
        uses: actions/upload-artifact@v4.6.2
        with:
          name: webdist
          path: webdist.tgz
          retention-days: 1

  go-static:
    name: Go Static
    runs-on: ubuntu-latest
    needs: prepare-webdist
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Restore embedded web assets
        uses: actions/download-artifact@v4.3.0
        with:
          name: webdist
          path: .

      - name: Extract embedded web assets
        run: tar -xzf webdist.tgz

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.2.0
        with:
          version-file: .golangci-lint-version

      - name: Check formatting
        run: make fmt-check

  go-sqlite:
    name: Go SQLite
    runs-on: ubuntu-latest
    needs: prepare-webdist
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Restore embedded web assets
        uses: actions/download-artifact@v4.3.0
        with:
          name: webdist
          path: .

      - name: Extract embedded web assets
        run: tar -xzf webdist.tgz

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Go
        run: go build ./...

      - name: Test Go with SQLite
        run: go test -race -count=1 -timeout 240s -cover ./...

  web-static:
    name: Web Static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Lint web
        run: npm run lint -w web

      - name: Typecheck web
        run: npm run typecheck -w web

  web-unit:
    name: Web Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run Vitest
        run: npm test -w web

  postgres-latest:
    name: Postgres Latest
    runs-on: ubuntu-latest
    env:
      TEST_POSTGRES_VERSION: ${{ env.POSTGRES_LATEST }}
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test Postgres integration
        run: go test -v -count=1 -timeout 300s -cover ./internal/database/...

  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    needs: prepare-webdist
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Restore embedded web assets
        uses: actions/download-artifact@v4.3.0
        with:
          name: webdist
          path: .

      - name: Extract embedded web assets
        run: tar -xzf webdist.tgz

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Playwright browsers
        uses: actions/cache@v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        run: npm run test:smoke -w e2e -- --reporter=line

  e2e-full:
    name: E2E Full
    runs-on: ubuntu-latest
    needs: prepare-webdist
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Restore embedded web assets
        uses: actions/download-artifact@v4.3.0
        with:
          name: webdist
          path: .

      - name: Extract embedded web assets
        run: tar -xzf webdist.tgz

      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Playwright browsers
        uses: actions/cache@v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full Playwright suite
        run: npm test -w e2e -- --reporter=line

  release-snapshot:
    name: Release Snapshot
    runs-on: ubuntu-latest
    needs:
      - prepare-webdist
      - go-static
      - go-sqlite
      - web-static
      - web-unit
      - postgres-latest
      - e2e-full
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Restore embedded web assets
        uses: actions/download-artifact@v4.3.0
        with:
          name: webdist
          path: .

      - name: Extract embedded web assets
        run: tar -xzf webdist.tgz

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build snapshot release
        uses: goreleaser/goreleaser-action@v7.0.0
        with:
          version: latest
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_PREBUILT_WEBDIST: "1"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: zitadel-snapshot
          path: dist/zitadel_*/
          retention-days: 7
