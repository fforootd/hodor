name: CI Main

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Fast And Extended CI
    uses: ./.github/workflows/reusable-ci.yml
    with:
      run_docs: true
      run_fast_rust: true
      run_fast_web: true
      run_extended_e2e: true
      run_browser_artifacts: true
      artifact_prefix: main
