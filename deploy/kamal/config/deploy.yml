# Kamal deployment for Zitadel Cloud POC
# Caddy handles TLS for customer custom domains, kamal-proxy handles Zitadel container lifecycle.
#
# Usage:
#   kamal setup           # bootstrap VM (installs Docker, deploys everything)
#   kamal deploy          # zero-downtime Zitadel redeploy
#   kamal accessory reboot caddy  # reload Caddy after config changes

service: zitadel
image: ffozitadel/zitadel

servers:
  web:
    hosts:
      - 5.78.120.93
    options:
      volume: "zitadel-data:/data"

proxy:
  host: 5.78.120.93
  app_port: 8080
  ssl: false
  healthcheck:
    interval: 3
    path: /healthz
    timeout: 3
  run:
    http_port: 8880
    bind_ips:
      - 127.0.0.1

env:
  clear:
    ZITADEL_MULTI_TENANT: "true"
    ZITADEL_PORT: "8080"
    ZITADEL_TLS_MODE: "external"
    ZITADEL_SEED_FILE: "/etc/zitadel/seed.yaml"
  secret:
    - ZITADEL_DATABASE_URL
    - ZITADEL_COOKIE_SECRETS
    - ZITADEL_ADMIN_PASSWORD
    - ZITADEL_ADMIN_PAT

accessories:
  caddy:
    image: caddy:2-alpine
    host: 5.78.120.93
    files:
      - config/Caddyfile:/etc/caddy/Caddyfile
    directories:
      - caddy-data:/data
    options:
      network: "host"

  redis:
    image: redis:7-alpine
    host: 5.78.120.93
    directories:
      - redis-data:/data
    options:
      network: "host"

registry:
  username: ffozitadel
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: root

builder:
  arch: amd64
  dockerfile: ../../Dockerfile.cloudflare
  context: ../..
