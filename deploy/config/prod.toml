# Zitadel Cloud — Production Environment
# Non-secret config. Secrets injected via env vars from 1Password at deploy time.

[server]
port = 8080
external_domain = "zitadel.example.com"

[server.security_headers]
hsts_enabled = true
hsts_max_age = 63072000
hsts_subdomains = true
hsts_preload = true
csp_enabled = true

[storage.stateful]
backend = "spanner"
url = ""
database = "projects/REPLACE_GCP_PROJECT/instances/zitadel-prod/databases/zitadel"
migrate = "check"
bootstrap = "skip"
max_open_conns = 50
max_idle_conns = 10
conn_max_lifetime = "1h"

[observability]
log_level = "info"
log_format = "json"
cache_path = "/tmp/zitadel-cache.db"
gcp_cloud_logging = true

[observability.streams.runtime]
sinks = ["stdout", "analytics"]
mode = "buffered"

[observability.streams.request]
sinks = ["stdout", "otel", "analytics"]
mode = "sampled"
sample_rate = 0.01

[observability.sinks.otel]
endpoint = "https://telemetry.googleapis.com"
protocol = "grpc"
auth = "gcp"
traces_enabled = true
metrics_enabled = true

[workers]
scheduler_enabled = true

[cloud]
enabled = true

[cloud.gcp]
project_id = "REPLACE_GCP_PROJECT"
certificate_map = "zitadel-cert-map"
url_map = "zitadel-lb"
backend_service = "zitadel-backend"
