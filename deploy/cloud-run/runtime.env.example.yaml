ZITADEL_SERVER__PORT: "8080"
ZITADEL_COOKIE_SECRETS: "replace-with-a-long-random-secret"

ZITADEL_STORAGE__STATEFUL__BACKEND: "spanner"
ZITADEL_STORAGE__STATEFUL__DATABASE: "projects/YOUR_PROJECT_ID/instances/YOUR_SPANNER_INSTANCE/databases/YOUR_DATABASE"
ZITADEL_STORAGE__STATEFUL__MIGRATE: "check"
ZITADEL_STORAGE__STATEFUL__BOOTSTRAP: "skip"

ZITADEL_OBSERVABILITY__CACHE_PATH: "/tmp/zitadel-cache.db"
ZITADEL_OBSERVABILITY__LOG_FORMAT: "json"
ZITADEL_OBSERVABILITY__GCP_CLOUD_LOGGING: "true"

# OTEL — direct export to GCP (traces, metrics, logs)
# Requires: roles/cloudtrace.agent, roles/monitoring.metricWriter on the service account
ZITADEL_OBSERVABILITY__SINKS__OTEL__ENDPOINT: "https://telemetry.googleapis.com"
ZITADEL_OBSERVABILITY__SINKS__OTEL__PROTOCOL: "grpc"
ZITADEL_OBSERVABILITY__SINKS__OTEL__AUTH: "gcp"
