[workspace]
resolver = "2"
members = [
    "crates/zitadel",
    "crates/zitadel-testkit",
    "crates/zitadel-observability",
    "crates/zitadel-server",
    "crates/zitadel-api",
    "crates/zitadel-fga",
    "crates/zitadel-storage",
    "crates/zitadel-db",
    "crates/zitadel-oidc",
    "crates/zitadel-login",
    "crates/zitadel-authn",
    "crates/zitadel-authz",
    "crates/zitadel-crypto",
    "crates/zitadel-config",
    "crates/zitadel-catalog",
    "crates/zitadel-schema",
    "crates/zitadel-expr",
    "crates/zitadel-botdetect",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "set-header", "compression-gzip"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Config
figment = { version = "0.10", features = ["toml", "env"] }
schemars = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["logs", "rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = ["logs", "grpc-tonic", "http-proto", "reqwest-client"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "any", "migrate"] }

# Crypto
argon2 = "0.5"
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"

# Auth
jsonwebtoken = "9"

# Misc
uuid = { version = "1", features = ["v4", "v7", "serde"] }
anyhow = "1"
thiserror = "2"
rust-embed = { version = "8", features = ["compression", "include-exclude"] }
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
webbrowser = "1"
keyring = "3"

# Workspace crate references
zitadel-config = { path = "crates/zitadel-config" }
zitadel-testkit = { path = "crates/zitadel-testkit" }
zitadel-observability = { path = "crates/zitadel-observability" }
zitadel-server = { path = "crates/zitadel-server" }
zitadel-api = { path = "crates/zitadel-api" }
zitadel-fga = { path = "crates/zitadel-fga" }
zitadel-storage = { path = "crates/zitadel-storage" }
zitadel-db = { path = "crates/zitadel-db" }
zitadel-oidc = { path = "crates/zitadel-oidc" }
zitadel-login = { path = "crates/zitadel-login" }
zitadel-authn = { path = "crates/zitadel-authn" }
zitadel-authz = { path = "crates/zitadel-authz" }
zitadel-crypto = { path = "crates/zitadel-crypto" }
zitadel-catalog = { path = "crates/zitadel-catalog" }
zitadel-schema = { path = "crates/zitadel-schema" }
zitadel-expr = { path = "crates/zitadel-expr" }
