# Dedicated config for Dockerized OIDC conformance runs.
# Uses an internal hostname on the Compose network and a private SQLite DB.

[server]
port = 8080
external_domain = "nginx"
public_origin = "https://nginx:8446"
force_insecure_cookies = false
cookie_secrets = ["zitadel-oidc-conformance-cookie-secret-do-not-use-in-production"]

[database]
url = "sqlite:///data/zitadel-conformance.db"

[observability]
cache_path = "/data/zitadel-conformance-cache.db"

[dev]
conformance_login_html = true
