# Dev config — deterministic secrets for reproducible local dev.
# Usage: make dev (or: go run ./cmd/zitadel start -c fixtures/zitadel.dev.toml)
#
# Admin: admin / admin123
# Dev PAT: zit_pat_zitadel-dev-pat-do-not-use-in-production

[server]
port = 8080
external_domain = "localhost"
cookie_secrets = ["zitadel-dev-cookie-secret-do-not-use-in-production"]

[database]
url = "sqlite://../data/zitadel.db"

[observability]
cache_path = "../data/zitadel-cache.db"

[dev]
mock_oidc = true
seed_file = "./seeds/frontend.yaml"
