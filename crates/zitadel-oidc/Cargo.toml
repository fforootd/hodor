[package]
name = "zitadel-oidc"
version.workspace = true
edition.workspace = true

[features]
arbitrary = ["dep:arbitrary"]

[dependencies]
arbitrary = { version = "1", features = ["derive"], optional = true }
zitadel-app = { workspace = true }
zitadel-db = { workspace = true }
zitadel-config = { workspace = true }
zitadel-authn = { workspace = true }
zitadel-crypto = { workspace = true }
zitadel-storage = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
jsonwebtoken = { workspace = true }
sha2 = { workspace = true }
base64 = "0.22"
rand = "0.8"
url = "2"
rsa = { version = "0.9", features = ["pkcs5", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
