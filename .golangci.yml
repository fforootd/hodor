version: "2"

linters:
  default: all
  disable:
    # Style preferences — not enforced in POC.
    - nlreturn       # Blank line before return.
    - wsl            # Whitespace style (deprecated).
    - wsl_v5         # Whitespace style (v2).
    - lll            # Line length.
    - varnamelen     # Variable name length.
    - nonamedreturns # Named returns are fine.
    - tagliatelle    # JSON tag casing.
    - ireturn        # Returning interfaces is idiomatic.
    - godox          # TODO/FIXME are fine in POC.
    - godot          # Comment punctuation.
    - godoclint      # Doc comment strictness.
    - funcorder      # Function ordering in file.
    - inamedparam    # Named params in interfaces.
    - gocritic       # Many opinionated suggestions — too noisy.

    # Complexity — reviewed by humans, not lint.
    - funlen
    - cyclop
    - gocognit
    - maintidx
    - nestif

    # Too strict for POC stage.
    - exhaustruct    # Not all struct fields need init.
    - exhaustive     # Exhaustive switch not needed.
    - wrapcheck      # Error wrapping comes later.
    - err113         # Dynamic errors are fine.
    - testpackage    # Same-package tests are fine.
    - paralleltest   # Not enforcing parallel tests.
    - tparallel      # Same.
    - containedctx   # Context in structs is fine.
    - gochecknoglobals # Globals for templates, configs.
    - goconst        # Repeated SQL strings.
    - dupl           # Duplicate code in early stage.
    - forcetypeassert # Controlled type assertions.
    - mnd            # Magic numbers in SQL, HTTP.
    - forbidigo      # fmt.Print is fine for now.
    - noctx          # http.NewRequest without ctx — fix incrementally.
    - perfsprint     # Performance sprintf variants.
    - unparam        # Unused params in interface implementations.
    - predeclared    # Shadowing builtins (rare false positives).
    - intrange       # Range over int — Go 1.22 style suggestion.
    - usestdlibvars  # Use stdlib constants — nice-to-have.
    - gochecknoinits # Init functions are fine for migrations.
    - modernize      # Modernize suggestions — do incrementally.
    - noinlineerr    # Inline error style preference.
    - usetesting     # testing.T context usage — incrementally.
    - errchkjson     # JSON error checking — too strict for POC.
    - errorlint      # Error wrapping style — comes later with err113.

  settings:
    depguard:
      rules:
        no-stdlib-log:
          files:
            - "!**/internal/logging/**"
          deny:
            - pkg: "log$"
              desc: "Use github.com/zitadel/zitadel/internal/logging instead of stdlib log."
    errcheck:
      exclude-functions:
        # Deferred rollback — no-op after successful commit.
        - (*database/sql.Tx).Rollback
        # Row scanning — errors checked via rows.Err() after loop.
        - (*database/sql.Row).Scan
        - (*database/sql.Rows).Scan
        # Template execution in HTTP handlers.
        - (*html/template.Template).Execute
        - (*text/template.Template).Execute
        # Deferred close — best-effort cleanup.
        - (*database/sql.Rows).Close
        - (*os.File).Close
        # JSON encoding/decoding in HTTP handlers — errors are write failures.
        - encoding/json.Unmarshal
        - (*encoding/json.Encoder).Encode
        - (*encoding/json.Decoder).Decode
        # HTTP response writes — errors mean client disconnected.
        - (net/http.ResponseWriter).Write
        - (*net/http.ResponseWriter).Write
        # SQL fire-and-forget (audit events, cleanup, index promotion).
        - (*database/sql.Tx).ExecContext
        - (*database/sql.DB).ExecContext
        - (*database/sql.DB).Exec
        - (*database/sql.Tx).Exec
        - (*net/http.Request).ParseForm
    govet:
      disable:
        - fieldalignment
    staticcheck:
      checks:
        - all
        - -SA1019       # Deprecated APIs — migrate incrementally.
    gosec:
      excludes:
        - G104          # Unhandled errors in deferred calls.
        - G115          # Integer overflow uint64→int64.
        - G101          # Hardcoded credentials in tests.
        - G120          # Request body size — add middleware later.
        - G705          # XSS taint in mock/dev endpoints.
        - G706          # Log injection — add structured logging later.
    revive:
      rules:
        - name: unexported-return
          disabled: true

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Mock OIDC server — relaxed security rules.
      - path: internal/mockoidc/
        linters: [gosec]
      # Legacy UI handlers being replaced by Vue.
      - path: internal/ui/
        linters: [unused]
    paths:
      - node_modules
      - web
      - third_party$
      - builtin$
      - examples$

formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
